# Builds the TafriTessy Android app (mobile/) into an installable APK.
# Download it from the run's "Artifacts" section, or from the
# "Android app (latest build)" release on the repository's Releases page.
name: Android APK

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/TafriTessy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TafriTessy-apk
          path: dist/TafriTessy.apk
          if-no-files-found: error

      # A fixed release whose APK link opens straight on a phone.
      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android app (latest build)" \
              --notes "Latest TafriTessy Android build. Download TafriTessy.apk on your phone to install it."
          gh release upload android-latest dist/TafriTessy.apk --clobber
          gh release edit android-latest --target "${{ github.sha }}" \
            --notes "Latest TafriTessy Android build from ${{ github.ref_name }} (${{ github.sha }}). Download TafriTessy.apk on your phone to install it."
